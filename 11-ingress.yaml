apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedinephro-ingress
  namespace: pedinephro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$
spec:
  rules:
  - host: pedinephro.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
