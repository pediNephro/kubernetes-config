apiVersion: apps/v1
kind: Deployment
metadata:
  name: vital-signs-service
  namespace: pedinephro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vital-signs-service
  template:
    metadata:
      labels:
        app: vital-signs-service
    spec:
      containers:
      - name: vital-signs-service
        image: azizos07/vital-signs-service:latest
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-password
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EUREKA_SERVER
        - name: SERVER_PORT
          value: "8084"
        ports:
        - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: vital-signs-service
  namespace: pedinephro
spec:
  selector:
    app: vital-signs-service
  ports:
  - port: 8084
    targetPort: 8084
