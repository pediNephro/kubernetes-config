apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pedinephro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: azizos07/gateway:latest
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EUREKA_SERVER
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pedinephro
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080