apiVersion: apps/v1
kind: Deployment
metadata:
  name: transplant-service
  namespace: pedinephro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transplant-service
  template:
    metadata:
      labels:
        app: transplant-service
    spec:
      containers:
      - name: transplant-service
        image: azizos07/transplant-service:latest

        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/pedinephro"
        - name: SPRING_DATASOURCE_USERNAME
          value: "pedinephro"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EUREKA_SERVER
        - name: KEYCLOAK_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_SERVER_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: KEYCLOAK_REALM
        - name: SERVER_PORT
          value: "8083"
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          value: "http://keycloak.pedinephro.svc.cluster.local:8080/realms/pedinephro"
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
          value: "http://keycloak.pedinephro.svc.cluster.local:8080/realms/pedinephro/protocol/openid-connect/certs"

        ports:
        - containerPort: 8083

        startupProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 30
          failureThreshold: 30
          periodSeconds: 5

        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10

        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: transplant-service
  namespace: pedinephro
spec:
  selector:
    app: transplant-service
  ports:
  - port: 8083
    targetPort: 8083