apiVersion: apps/v1
kind: Deployment
metadata:
  name: transplant-service
  namespace: pedinephro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transplant-service
  template:
    metadata:
      labels:
        app: transplant-service
    spec:
      containers:
      - name: transplant-service
        image: azizos07/transplant-service:latest
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-password
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EUREKA_SERVER
        - name: SERVER_PORT
          value: "8083"
        ports:
        - containerPort: 8083
        startupProbe:
          tcpSocket:
            port: 8083
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: transplant-service
  namespace: pedinephro
spec:
  selector:
    app: transplant-service
  ports:
  - port: 8083
    targetPort: 8083
