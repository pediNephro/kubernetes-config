apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-records
  namespace: pedinephro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-records
  template:
    metadata:
      labels:
        app: medical-records
    spec:
      containers:
      - name: medical-records
        image: azizos07/medical-records:latest
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-password
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: EUREKA_SERVER
        - name: SERVER_PORT
          value: "8082"
        ports:
        - containerPort: 8082
        startupProbe:
          tcpSocket:
            port: 8082
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: medical-records
  namespace: pedinephro
spec:
  selector:
    app: medical-records
  ports:
  - port: 8082
    targetPort: 8082
