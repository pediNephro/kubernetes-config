apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospitalisation
  namespace: pedinephro

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hospitalisation

  template:
    metadata:
      labels:
        app: hospitalisation

    spec:
      containers:
        - name: hospitalisation
          image: alaadid/hospitalisation:12

          ports:
            - containerPort: 8089

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mysql-password

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EUREKA_SERVER

            - name: SERVER_PORT
              value: "8089"

---
apiVersion: v1
kind: Service

metadata:
  name: hospitalisation
  namespace: pedinephro

spec:
  selector:
    app: hospitalisation

  ports:
    - port: 8089
      targetPort: 8089
